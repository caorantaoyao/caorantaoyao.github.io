<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 — CAORAN</title>
<meta name="description" content="Caoran 知识库：按分类筛选与全文搜索，浏览同步自飞书的全部文章。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c; --surface: #121216; --surface-raised: #17171c;
    --border: #232327; --border-soft: #1b1b1f;
    --text: #e6e2da; --text-muted: #837e76; --text-dim: #4c4842;
    --accent: #c9a87c; --accent-bright: #dcc199; --accent-glow: rgba(201,168,124,0.14); --accent-dim: #8a6d4b;
    --green: #86a596; --red: #c98a8a; --violet: #9a8fb5; --blue: #7f96b0;
    --font-serif: 'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
    --font-mono: 'JetBrains Mono','SF Mono',monospace;
    --gap: clamp(1.1rem,3vw,2.5rem); --max-width: 1180px;
    --ease: cubic-bezier(0.22,1,0.36,1);
  }
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-serif);
    line-height:1.7; -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100dvh; }
  ::selection { background:var(--accent-dim); color:#0a0a0c; }
  body::after { content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse 70% 50% at 50% -8%, var(--accent-glow) 0%, transparent 62%); }
  .container { position:relative; z-index:2; max-width:var(--max-width); margin:0 auto; padding:0 var(--gap); }

  nav { position:sticky; top:0; z-index:100; padding:1.15rem 0;
    backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
    background:rgba(10,10,12,0.82); border-bottom:1px solid var(--border-soft); }
  nav .container { display:flex; justify-content:space-between; align-items:center; }
  .nav-logo { font-family:var(--font-mono); font-size:0.85rem; font-weight:500; letter-spacing:0.28em;
    color:var(--accent); text-decoration:none; text-transform:uppercase; display:inline-flex; align-items:center; gap:0.55rem; }
  .nav-logo .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .nav-links { display:flex; gap:1.9rem; list-style:none; }
  .nav-links a { font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.1em; color:var(--text-muted);
    text-decoration:none; text-transform:uppercase; transition:color 0.2s; position:relative; }
  .nav-links a::after { content:''; position:absolute; bottom:-5px; left:0; right:0; height:1px;
    background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform 0.3s var(--ease); }
  .nav-links a:hover { color:var(--text); }
  .nav-links a:hover::after { transform:scaleX(1); }

  /* ── Header ── */
  .lib-head { padding: clamp(3rem,8vh,5.5rem) 0 2.5rem; }
  .lib-eyebrow { font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.16em; color:var(--accent-dim);
    text-transform:uppercase; margin-bottom:1rem; display:flex; align-items:center; gap:0.7rem; }
  .lib-eyebrow::before { content:''; width:1.6rem; height:1px; background:var(--accent-dim); }
  .lib-head h1 { font-size:clamp(2.2rem,5vw,3.4rem); font-weight:700; letter-spacing:-0.025em; line-height:1.15; }
  .lib-head p { color:var(--text-muted); margin-top:0.9rem; max-width:600px; }

  /* ── Toolbar ── */
  .toolbar { position:sticky; top:60px; z-index:50; padding:1rem 0 1.2rem;
    background:linear-gradient(var(--bg) 70%, transparent); }
  .search-box { position:relative; margin-bottom:1.1rem; }
  .search-box input {
    width:100%; background:var(--surface); border:1px solid var(--border-soft); border-radius:4px;
    color:var(--text); font-family:var(--font-serif); font-size:1rem; padding:0.95rem 1.1rem 0.95rem 2.8rem;
    outline:none; transition:border-color 0.3s, background 0.3s; }
  .search-box input:focus { border-color:var(--accent-dim); background:var(--surface-raised); }
  .search-box input::placeholder { color:var(--text-dim); }
  .search-box .ico { position:absolute; left:1rem; top:50%; transform:translateY(-50%);
    color:var(--text-dim); font-family:var(--font-mono); font-size:0.9rem; pointer-events:none; }
  .filters { display:flex; flex-wrap:wrap; gap:0.55rem; }
  .chip {
    font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.03em; color:var(--text-muted);
    background:transparent; border:1px solid var(--border); border-radius:100px; padding:0.42rem 0.95rem;
    cursor:pointer; transition:all 0.25s var(--ease); display:inline-flex; align-items:center; gap:0.45rem; white-space:nowrap; }
  .chip:hover { color:var(--text); border-color:var(--accent-dim); }
  .chip.active { color:#0a0a0c; background:var(--accent); border-color:var(--accent); font-weight:500; }
  .chip .n { opacity:0.6; font-size:0.62rem; }
  .chip.active .n { opacity:0.75; }
  .chip .cd { width:7px; height:7px; border-radius:50%; }
  .cd-all{background:var(--text-muted)} .cd-route{background:var(--accent)} .cd-subject{background:var(--green)}
  .cd-asset{background:var(--blue)} .cd-inbox{background:var(--violet)} .cd-review{background:var(--red)} .cd-template{background:var(--text-muted)}
  .chip.active .cd { background:#0a0a0c !important; }

  /* ── Results ── */
  .results { padding-bottom:5rem; }
  .result-meta { font-family:var(--font-mono); font-size:0.7rem; color:var(--text-dim); letter-spacing:0.05em; margin-bottom:1.8rem; }
  .group { margin-bottom:3rem; }
  .group-title { display:flex; align-items:center; gap:0.7rem; margin-bottom:1.2rem;
    font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-muted); }
  .group-title .gd { width:8px; height:8px; border-radius:50%; }
  .group-title .line { flex:1; height:1px; background:var(--border-soft); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.2rem; }
  .card {
    position:relative; background:var(--surface); border:1px solid var(--border-soft); border-radius:4px;
    padding:1.7rem; text-decoration:none; color:inherit; overflow:hidden;
    transition:transform 0.35s var(--ease), border-color 0.35s, background 0.35s; display:flex; flex-direction:column; }
  .card::after { content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:0; transition:opacity 0.35s; }
  .card:hover { transform:translateY(-3px); border-color:var(--accent-dim); background:var(--surface-raised); }
  .card:hover::after { opacity:0.7; }
  .card-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.9rem; }
  .card-date { font-family:var(--font-mono); font-size:0.66rem; color:var(--text-dim); letter-spacing:0.04em; }
  .card-tag { font-family:var(--font-mono); font-size:0.58rem; letter-spacing:0.06em; text-transform:uppercase;
    padding:0.2rem 0.55rem; border:1px solid var(--border); border-radius:2px; color:var(--text-muted); }
  .card h3 { font-size:1.12rem; font-weight:600; line-height:1.5; margin-bottom:0.55rem; }
  .card p { font-size:0.87rem; color:var(--text-muted); line-height:1.65; flex:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card .more { font-family:var(--font-mono); font-size:0.66rem; color:var(--accent-dim); margin-top:1rem;
    display:flex; align-items:center; gap:0.4rem; letter-spacing:0.04em; }
  .card .more::after { content:'→'; transition:transform 0.25s var(--ease); }
  .card:hover .more::after { transform:translateX(4px); }
  mark { background:rgba(201,168,124,0.28); color:var(--accent-bright); border-radius:2px; padding:0 1px; }
  .empty { font-family:var(--font-mono); font-size:0.85rem; color:var(--text-dim); padding:3rem 0; text-align:center; letter-spacing:0.04em; }

  .reveal { opacity:0; transform:translateY(20px); transition:opacity 0.6s var(--ease), transform 0.6s var(--ease); }
  .reveal.visible { opacity:1; transform:translateY(0); }

  footer { border-top:1px solid var(--border-soft); padding:2.6rem 0; }
  footer .container { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
  .footer-left { font-family:var(--font-mono); font-size:0.68rem; color:var(--text-dim); letter-spacing:0.04em; }
  .footer-right { display:flex; gap:1.6rem; }
  .footer-right a { font-family:var(--font-mono); font-size:0.7rem; color:var(--text-dim); text-decoration:none; transition:color 0.2s; }
  .footer-right a:hover { color:var(--accent); }

  @media (max-width:820px){ .nav-links{gap:1.1rem;} .toolbar{top:56px;} .grid{grid-template-columns:1fr;} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important;} .reveal{opacity:1;transform:none;} }
</style>
</head>
<body>

<nav>
  <div class="container">
    <a href="index.html" class="nav-logo"><span class="dot"></span>CAORAN</a>
    <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="index.html#about">关于</a></li>
      <li><a href="https://my.feishu.cn/wiki/E9BuwXR9qiZfGmkLo95cBRNUnph" target="_blank" rel="noopener">飞书 &#8599;</a></li>
    </ul>
  </div>
</nav>

<header class="container lib-head">
  <div class="lib-eyebrow">飞书知识库 · 全部</div>
  <h1>知识库</h1>
  <p>同步自飞书知识库的全部文章。按分类筛选，或直接搜索标题与摘要。</p>
</header>

<div class="toolbar">
  <div class="container">
    <div class="search-box">
      <span class="ico">&#8981;</span>
      <input type="search" id="q" placeholder="搜索标题、摘要、分类…" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
  </div>
</div>

<main class="container results">
  <div class="result-meta" id="result-meta">正在加载…</div>
  <div id="results"></div>
</main>

<footer>
  <div class="container">
    <span class="footer-left">&copy; 2026 Caoran. Built with intent, not frameworks.</span>
    <div class="footer-right">
      <a href="index.html">首页</a>
      <a href="https://github.com/caorantaoyao" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:caoran@caoran.cn">Mail</a>
    </div>
  </div>
</footer>

<script>
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const CAT_META = {
    '岗位路线':'cd-route','学科知识正文':'cd-subject','项目与面试资产':'cd-asset',
    '知识收件箱':'cd-inbox','待人工确认':'cd-review','标准知识文档模板':'cd-template'
  };
  const CAT_ORDER = Object.keys(CAT_META);

  let ALL = [], curCat = 'all', curQ = '';

  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } }),
    { threshold:0.1, rootMargin:'0px 0px -30px 0px' });

  // highlight query in text (safe: escape first, then wrap)
  function hl(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi');
    return safe.replace(re, '<mark>$1</mark>');
  }

  function cardHTML(a, q) {
    return `<a href="${esc(a.url)}" class="card reveal">
      <div class="card-meta">
        <span class="card-date">${esc(a.date)}</span>
        <span class="card-tag">${esc(a.category)}</span>
      </div>
      <h3>${hl(a.title,q)}</h3>
      <p>${hl(a.summary,q)}</p>
      <span class="more">阅读全文</span>
    </a>`;
  }

  function render() {
    const q = curQ.trim().toLowerCase();
    let list = ALL.slice();
    if (curCat !== 'all') list = list.filter(a => a.category === curCat);
    if (q) list = list.filter(a =>
      (a.title||'').toLowerCase().includes(q) ||
      (a.summary||'').toLowerCase().includes(q) ||
      (a.category||'').toLowerCase().includes(q));

    const meta = document.getElementById('result-meta');
    const box = document.getElementById('results');
    meta.textContent = list.length
      ? `${list.length} 篇` + (curCat!=='all' ? ` · ${curCat}` : '') + (curQ ? ` · 匹配 “${curQ}”` : '')
      : '';

    if (!list.length) { box.innerHTML = `<div class="empty">没有匹配的文章。试试其他关键词或分类。</div>`; return; }

    // group by category when browsing all & no query; else flat grid
    let html;
    if (curCat === 'all' && !q) {
      const groups = {}; list.forEach(a => (groups[a.category]=groups[a.category]||[]).push(a));
      html = CAT_ORDER.filter(c=>groups[c]).map(c => {
        const cd = CAT_META[c] || 'cd-all';
        return `<section class="group">
          <div class="group-title"><span class="gd ${cd}"></span>${esc(c)} <span style="color:var(--text-dim)">· ${groups[c].length}</span><span class="line"></span></div>
          <div class="grid">${groups[c].map(a=>cardHTML(a,'')).join('')}</div>
        </section>`;
      }).join('');
    } else {
      html = `<div class="grid">${list.map(a=>cardHTML(a,curQ.trim())).join('')}</div>`;
    }
    box.innerHTML = html;
    box.querySelectorAll('.reveal').forEach(el => io.observe(el));
  }

  function buildFilters() {
    const counts = {}; ALL.forEach(a => counts[a.category]=(counts[a.category]||0)+1);
    const cats = CAT_ORDER.filter(c=>counts[c]);
    const wrap = document.getElementById('filters');
    let html = `<button class="chip ${curCat==='all'?'active':''}" data-cat="all"><span class="cd cd-all"></span>全部 <span class="n">${ALL.length}</span></button>`;
    html += cats.map(c => `<button class="chip ${curCat===c?'active':''}" data-cat="${esc(c)}"><span class="cd ${CAT_META[c]}"></span>${esc(c)} <span class="n">${counts[c]}</span></button>`).join('');
    wrap.innerHTML = html;
    wrap.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      curCat = b.dataset.cat;
      wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const u = new URL(location); if (curCat==='all') u.searchParams.delete('cat'); else u.searchParams.set('cat',curCat);
      history.replaceState(null,'',u);
      render();
    }));
  }

  async function init() {
    try {
      const res = await fetch('data/articles.json', { cache:'no-cache' });
      if (!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      ALL = (data && data.articles) || [];
      const cat = new URLSearchParams(location.search).get('cat');
      if (cat && ALL.some(a=>a.category===cat)) curCat = cat;
      buildFilters();
      render();
    } catch (e) {
      document.getElementById('result-meta').textContent = '';
      document.getElementById('results').innerHTML =
        `<div class="empty">知识库加载失败（${esc(e.message)}）。首次运行需先在 Actions 触发同步。</div>`;
    }
  }

  let t; document.getElementById('q').addEventListener('input', e => {
    clearTimeout(t); t = setTimeout(() => { curQ = e.target.value; render(); }, 120);
  });

  init();
</script>

</body>
</html>
